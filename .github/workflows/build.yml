name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache local Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build and Test with JaCoCo
        run: mvn -B verify -Djacoco.skip=false

      - name: Debug - List generated files
        run: find target -type f

      - name: Debug - Check JaCoCo Report Presence
        run: ls -lh target/site/jacoco || echo "No JaCoCo directory found"

      - name: Debug - Show test output (if any)
        run: cat target/surefire-reports/*.txt || echo "No test output found"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          path-to-lcov: target/site/jacoco/jacoco.xml
          base-path: .
