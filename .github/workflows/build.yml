name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache local Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build and Test with JaCoCo
        run: mvn -B verify -Djacoco.skip=false

      # Convert JaCoCo XML to lcov format
      - name: Convert JaCoCo XML to lcov
        run: |
          curl -s https://raw.githubusercontent.com/ecampidoglio/jacoco-to-lcov/main/jacoco-to-lcov -o jacoco-to-lcov
          chmod +x jacoco-to-lcov
          ./jacoco-to-lcov target/site/jacoco/jacoco.xml > target/site/jacoco/lcov.info

      - name: List coverage outputs
        run: ls -lh target/site/jacoco || echo "No Jacoco directory found"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: target/site/jacoco/lcov.info

